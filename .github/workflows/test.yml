name: Test

# Tests also run in the Deploy workflow, but that only fires after a merge to
# main — by which point a failure has already reached the office screen. This
# runs them on the pull request instead, so a red check shows up before merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
